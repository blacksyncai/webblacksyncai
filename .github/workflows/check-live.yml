name: Check live blacksync.ai content

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/check-live.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live bundle + simulate embed load
        run: |
          HTML=$(curl -sL https://www.blacksync.ai/)
          echo "$HTML" | grep -oE 'src="[^"]*\.js"' | sed 's/src="//;s/"//' | while read -r JS; do
            case "$JS" in
              /*) URL="https://www.blacksync.ai$JS" ;;
              http*) URL="$JS" ;;
              *) URL="https://www.blacksync.ai/$JS" ;;
            esac
            echo "--- bundle: $URL"
            curl -sL "$URL" -o bundle.js
            echo "calendly refs: $(grep -c 'calendly' bundle.js || true)"
            echo "app.cal.com/embed refs: $(grep -c 'app\.cal\.com/embed' bundle.js || true)"
            echo "iframe-poll fallback present: $(grep -c 'querySelector(.iframe.)' bundle.js || true)"
            echo "loading available times text: $(grep -c 'Loading available times' bundle.js || true)"
          done
          echo "=== embed script HTTP status ==="
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" https://app.cal.com/embed/embed.js
          echo "=== booking page status ==="
          curl -s -o /dev/null -w "%{http_code}\n" "https://cal.com/hamza-basal-v1hqkl/15min"
