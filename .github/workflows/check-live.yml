name: Check live blacksync.ai content

on:
  push:
    branches: ["claude/nice-keller-ur7mnt"]
    paths: [".github/workflows/check-live.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homepage and bundles, grep for login targets
        run: |
          set -x
          HTML=$(curl -sL https://blacksync.ai/)
          echo "$HTML" | grep -oE 'src="[^"]*\.js"' | sed 's/src="//;s/"//' | while read -r JS; do
            case "$JS" in
              /*) URL="https://blacksync.ai$JS" ;;
              http*) URL="$JS" ;;
              *) URL="https://blacksync.ai/$JS" ;;
            esac
            echo "--- bundle: $URL"
            curl -sL "$URL" -o bundle.js
            grep -o "ai\.blacksync\.[a-z]*\|blacksync\.si" bundle.js | sort | uniq -c || echo "(no matches)"
          done
          echo "=== /login status ==="
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" https://blacksync.ai/login
