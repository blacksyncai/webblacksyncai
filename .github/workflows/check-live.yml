name: Check live blacksync.ai content

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/check-live.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live bundle
        run: |
          HTML=$(curl -sL https://www.blacksync.ai/)
          echo "$HTML" | grep -oE 'src="[^"]*\.js"' | sed 's/src="//;s/"//' | while read -r JS; do
            case "$JS" in
              /*) URL="https://www.blacksync.ai$JS" ;;
              http*) URL="$JS" ;;
              *) URL="https://www.blacksync.ai/$JS" ;;
            esac
            echo "--- bundle: $URL"
            curl -sL "$URL" -o bundle.js
            echo "ai.blacksync.cloud refs: $(grep -c 'ai\.blacksync\.cloud' bundle.js || true)"
            echo "blacksync.si refs: $(grep -c 'blacksync\.si' bundle.js || true)"
            grep -o ".\{80\}blacksync\.si.\{80\}" bundle.js | head -3
          done
