name: Check live blacksync.ai content

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/check-live.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live bundle
        run: |
          HTML=$(curl -sL https://www.blacksync.ai/)
          echo "$HTML" | grep -oE 'src="[^"]*\.js"' | sed 's/src="//;s/"//' | while read -r JS; do
            case "$JS" in
              /*) URL="https://www.blacksync.ai$JS" ;;
              http*) URL="$JS" ;;
              *) URL="https://www.blacksync.ai/$JS" ;;
            esac
            echo "--- bundle: $URL"
            curl -sL "$URL" -o bundle.js
            echo "calendly.com refs: $(grep -c 'calendly\.com' bundle.js || true)"
            echo "cal.com refs: $(grep -c 'app\.cal\.com\|cal\.com/hamza' bundle.js || true)"
            echo "chatgpt plugin refs: $(grep -c 'ChatGPT & Claude Plugins' bundle.js || true)"
          done
          echo "=== Cal.com embed script reachable? ==="
          curl -s -o /dev/null -w "%{http_code}\n" https://app.cal.com/embed/embed.js
          echo "=== Cal.com booking page status ==="
          curl -s -o /dev/null -w "%{http_code}\n" "https://cal.com/hamza-basal-v1hqkl/15min"
