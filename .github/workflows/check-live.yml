name: Check live blacksync.ai content

on:
  push:
    branches: ["claude/nice-keller-ur7mnt"]
    paths: [".github/workflows/check-live.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live bundle around ai.blacksync.cloud
        run: |
          HTML=$(curl -sL https://www.blacksync.ai/)
          echo "$HTML" | grep -oE 'src="[^"]*\.js"' | sed 's/src="//;s/"//' | while read -r JS; do
            case "$JS" in
              /*) URL="https://www.blacksync.ai$JS" ;;
              http*) URL="$JS" ;;
              *) URL="https://www.blacksync.ai/$JS" ;;
            esac
            echo "--- bundle: $URL"
            curl -sL "$URL" -o bundle.js
            grep -o ".\{120\}ai\.blacksync\.cloud.\{120\}" bundle.js | head -5
            echo "--- /login status:"
          done
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" https://www.blacksync.ai/login
          echo "--- headers for /login:"
          curl -sI https://www.blacksync.ai/login | head -20
