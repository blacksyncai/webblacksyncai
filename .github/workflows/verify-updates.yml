name: Verify updates pages live

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/verify-updates.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check public URLs
        run: |
          echo "=== Image ==="
          curl -s -o /dev/null -w "status: %{http_code}\ncontent-type: %{content_type}\nsize: %{size_download} bytes\n" "https://www.blacksync.ai/images/blacksync-chatgpt-launch.jpg"
          file=$(curl -s "https://www.blacksync.ai/images/blacksync-chatgpt-launch.jpg" | head -c 4 | xxd -p)
          echo "magic bytes: $file (ffd8ff.. = JPEG)"
          echo "=== /updates ==="
          curl -s -o /dev/null -w "status: %{http_code}\n" "https://www.blacksync.ai/updates"
          curl -s "https://www.blacksync.ai/updates" | grep -o "<title>[^<]*</title>"
          echo "=== /updates/chatgpt-integration ==="
          curl -s -o /dev/null -w "status: %{http_code}\n" "https://www.blacksync.ai/updates/chatgpt-integration"
          curl -s "https://www.blacksync.ai/updates/chatgpt-integration" | grep -oE '<meta property="og:image"[^>]*>'
          curl -s "https://www.blacksync.ai/updates/chatgpt-integration" | grep -o "<title>[^<]*</title>"
