name: Headless browser test of booking flow

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/debug-booking.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install puppeteer
        run: npm i puppeteer --silent --no-fund --no-audit
      - name: Load live site, open Book a Call, submit form, watch embed
        run: |
          cat > test.mjs <<'EOF'
          import puppeteer from 'puppeteer';
          const browser = await puppeteer.launch({headless: 'new', args:['--no-sandbox','--enable-unsafe-swiftshader']});
          const page = await browser.newPage();
          const logs = [];
          page.on('console', m => { const t = m.text(); if (!/WebGL|swiftshader|ReadPixel/.test(t)) logs.push(`[console.${m.type()}] ${t.slice(0,300)}`); });
          page.on('pageerror', e => logs.push(`[pageerror] ${e.message.slice(0,300)}`));
          page.on('requestfailed', r => logs.push(`[reqfail] ${r.url().slice(0,160)} :: ${r.failure()?.errorText}`));
          page.on('response', async r => {
            const u = r.url();
            if (u.includes('cal.com') || u.includes('calendly')) logs.push(`[cal-resp ${r.status()}] ${u.slice(0,160)}`);
            if (r.status() >= 400) logs.push(`[HTTP ${r.status()}] ${u.slice(0,160)}`);
          });
          await page.goto('https://www.blacksync.ai/', {waitUntil:'domcontentloaded', timeout:90000});
          await new Promise(r => setTimeout(r, 6000));
          const clicked = await page.evaluate(() => {
            const els = [...document.querySelectorAll('button, a')];
            const b = els.find(e => /book a call/i.test(e.textContent||''));
            if (b) { b.click(); return true; }
            return false;
          });
          console.log('clicked Book a Call:', clicked);
          await new Promise(r => setTimeout(r, 2500));
          // inspect the dialog form
          const formInfo = await page.evaluate(() => {
            const dialog = document.querySelector('[role="dialog"]');
            if (!dialog) return {dialog:false};
            const inputs = [...dialog.querySelectorAll('input, textarea, select, button')].map(e => ({
              tag: e.tagName, type: e.type, name: e.name, id: e.id, label: e.getAttribute('aria-label'),
              text: (e.tagName==='BUTTON') ? e.textContent.trim().slice(0,40) : undefined
            }));
            return {dialog:true, inputs};
          });
          console.log('FORM:', JSON.stringify(formInfo).slice(0, 1200));
          // fill every visible text input in the dialog
          await page.evaluate(() => {
            const dialog = document.querySelector('[role="dialog"]');
            if (!dialog) return;
            const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
            dialog.querySelectorAll('input').forEach(inp => {
              if (inp.offsetParent === null) return;
              const v = inp.type === 'tel' || /phone/i.test(inp.name||'') ? '5551234567'
                : inp.type === 'email' ? 'test@example.com'
                : /industry/i.test(inp.name||'') ? 'Real Estate' : 'Test';
              setter.call(inp, v);
              inp.dispatchEvent(new Event('input', {bubbles:true}));
            });
          });
          await new Promise(r => setTimeout(r, 1000));
          const submitted = await page.evaluate(() => {
            const dialog = document.querySelector('[role="dialog"]');
            if (!dialog) return 'NO DIALOG';
            const btns = [...dialog.querySelectorAll('button')];
            const b = btns.find(e => /book|schedule|continue|submit/i.test(e.textContent||''));
            if (b) { b.click(); return b.textContent.trim().slice(0,40); }
            return 'NO BUTTON: ' + btns.map(x=>x.textContent.trim().slice(0,20)).join(' | ');
          });
          console.log('submitted with:', submitted);
          for (let i = 0; i <= 25; i++) {
            await new Promise(r => setTimeout(r, 1000));
            const s = await page.evaluate(() => ({
              dialog: !!document.querySelector('[role="dialog"]'),
              iframe: !!document.querySelector('[role="dialog"] iframe, [data-testid="cal-inline-widget"] iframe'),
              calScript: !!document.querySelector('script[src*="cal.com"]'),
              loadingVisible: (() => { const l = document.querySelector('[data-testid="cal-loading"]'); return !!l && l.offsetParent !== null; })(),
              fallback: !!document.querySelector('[data-testid="cal-fallback"]'),
            }));
            if (i % 5 === 0 || s.iframe || s.fallback) console.log(`t=${i}s:`, JSON.stringify(s));
            if (s.iframe || s.fallback) break;
          }
          console.log('--- page log ---');
          logs.forEach(l => console.log(l));
          await browser.close();
          EOF
          node test.mjs
# rerun: 105034
