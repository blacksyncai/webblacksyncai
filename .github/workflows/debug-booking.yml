name: Headless browser test of booking flow

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/debug-booking.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install puppeteer
        run: npm i puppeteer --silent --no-fund --no-audit
      - name: Load live site, open Book a Call, submit form, watch embed
        run: |
          cat > test.mjs <<'EOF'
          import puppeteer from 'puppeteer';
          const browser = await puppeteer.launch({headless: 'new', args:['--no-sandbox']});
          const page = await browser.newPage();
          const logs = [];
          page.on('console', m => logs.push(`[console.${m.type()}] ${m.text()}`));
          page.on('pageerror', e => logs.push(`[pageerror] ${e.message}`));
          page.on('requestfailed', r => logs.push(`[reqfail] ${r.url().slice(0,120)} ${r.failure()?.errorText}`));
          page.on('response', r => { if (r.url().includes('cal.com')) logs.push(`[cal.com ${r.status()}] ${r.url().slice(0,140)}`); });
          await page.goto('https://www.blacksync.ai/', {waitUntil:'domcontentloaded', timeout:90000});
          await new Promise(r => setTimeout(r, 6000));
          // Find and click the Book a Call button
          const clicked = await page.evaluate(() => {
            const els = [...document.querySelectorAll('button, a')];
            const b = els.find(e => /book a call/i.test(e.textContent||''));
            if (b) { b.click(); return true; }
            return false;
          });
          console.log('clicked Book a Call:', clicked);
          await new Promise(r => setTimeout(r, 2000));
          // Fill the form if present
          const filled = await page.evaluate(() => {
            const tel = document.querySelector('input[type="tel"], input[name="phone"]');
            if (tel) { const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set; setter.call(tel,'5551234567'); tel.dispatchEvent(new Event('input',{bubbles:true})); return true; }
            return false;
          });
          console.log('phone field found:', filled);
          await new Promise(r => setTimeout(r, 1000));
          const submitted = await page.evaluate(() => {
            const btns = [...document.querySelectorAll('button')];
            const b = btns.find(e => /book|schedule|continue|submit|get started/i.test(e.textContent||'') && !/cancel/i.test(e.textContent||''));
            if (b && b.offsetParent !== null) { b.click(); return b.textContent; }
            return null;
          });
          console.log('submitted with:', submitted);
          // Wait and observe the embed
          for (let i = 0; i <= 30; i++) {
            await new Promise(r => setTimeout(r, 1000));
            const s = await page.evaluate(() => {
              const dialog = document.querySelector('[role="dialog"]');
              const iframe = document.querySelector('[data-testid="cal-inline-widget"] iframe, [role="dialog"] iframe');
              const loading = document.querySelector('[data-testid="cal-loading"]');
              const fallback = document.querySelector('[data-testid="cal-fallback"]');
              return { iframe: !!iframe, loadingVisible: !!loading && loading.offsetParent !== null, fallback: !!fallback, dialog: !!dialog };
            });
            if (i % 5 === 0 || s.iframe || s.fallback) console.log(`t=${i}s:`, JSON.stringify(s));
            if (s.iframe || s.fallback) break;
          }
          console.log('--- page log ---');
          logs.slice(0, 60).forEach(l => console.log(l));
          await browser.close();
          EOF
          node test.mjs
