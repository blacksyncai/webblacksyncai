name: Debug live booking embed

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/debug-booking.yml"]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Puppeteer
        run: npm i -g puppeteer --silent 2>&1 | tail -1 || true
      - name: Probe Cal.com API like the embed does
        run: |
          echo "=== 1. Does the embed script load? ==="
          curl -sI https://app.cal.com/embed/embed.js | head -5
          echo "=== 2. What does the embed script fetch for availability? ==="
          curl -s "https://app.cal.com/api/trpc/booking/getSchedule?json=%7B%22json%22%3A%7B%22eventTypeId%22%3Anull%2C%22username%22%3A%22hamza-basal-v1hqkl%22%2C%22eventSlug%22%3A%2215min%22%7D%7D" | head -c 500
          echo
          echo "=== 3. Direct event page API ==="
          curl -s -H "Accept: application/json" "https://cal.com/api/booking/hamza-basal-v1hqkl/15min" -o /dev/null -w "%{http_code}\n"
          echo "=== 4. trpc public event ==="
          curl -s -X POST "https://app.cal.com/api/trpc/public/event?batch=1" \
            -H "Content-Type: application/json" \
            -d '{"json":{"username":"hamza-basal-v1hqkl","eventSlug":"15min","isTeamEvent":false,"org":null,"language":"en"}}' | head -c 600
          echo
          echo "=== 5. Public user check ==="
          curl -s -X POST "https://app.cal.com/api/trpc/public/username?batch=1" \
            -H "Content-Type: application/json" \
            -d '{"json":{"username":"hamza-basal-v1hqkl"}}' | head -c 400
