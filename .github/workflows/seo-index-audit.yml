name: SEO indexing audit for real-estate use-case pages

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/seo-index-audit.yml"]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Deep check
        run: |
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          echo "===== raw head of /fsbo-ai ====="
          curl -s -A "$UA" https://www.blacksync.ai/fsbo-ai | head -c 900
          echo
          echo
          echo "===== raw head of / ====="
          curl -s -A "$UA" https://www.blacksync.ai/ | head -c 500
          echo
          echo
          echo "===== head of /real-estate (control) ====="
          curl -s -A "$UA" https://www.blacksync.ai/real-estate | head -c 400
          echo
          echo
          echo "===== trailing slash / direct file ====="
          curl -s -o /dev/null -w "%{http_code} %{url_effective}\n" -A "$UA" -L https://www.blacksync.ai/fsbo-ai/
          echo "===== response headers /fsbo-ai ====="
          curl -sI -A "$UA" https://www.blacksync.ai/fsbo-ai | head -20
