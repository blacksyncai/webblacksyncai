name: SEO indexing audit for real-estate use-case pages

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/seo-index-audit.yml"]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare parser
        run: |
          cat > /tmp/parse.py <<'PYEOF'
          import re
          h = open('/tmp/page.html').read()
          m = re.search(r'<body.*?</body>', h, re.S)
          t = re.sub(r'<[^>]+>', ' ', m.group(0) if m else '')
          print(len(re.sub(r'\s+', ' ', t).strip()))
          PYEOF
      - name: Full verification
        run: |
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for p in / /real-estate /fsbo-ai /expired-listing-ai /ai-cold-caller; do
            curl -s -A "$UA" "https://www.blacksync.ai$p" -o /tmp/page.html
            echo "########## $p ##########"
            echo "HTTP: $(curl -s -o /dev/null -w '%{http_code}' -A "$UA" https://www.blacksync.ai$p)"
            echo "TITLE: $(grep -oE '<title>[^<]*</title>' /tmp/page.html | head -1)"
            echo "CANONICAL: $(grep -oE '<link rel="canonical" href="[^"]*"' /tmp/page.html | head -1)"
            echo "ROBOTS: $(grep -oE '<meta name="robots" content="[^"]*"' /tmp/page.html | head -1)"
            echo "OG-URL: $(grep -oE '<meta property="og:url" content="[^"]*"' /tmp/page.html | head -1)"
            echo "OG-IMAGE: $(grep -oE '<meta property="og:image" content="[^"]*"' /tmp/page.html | head -1)"
            echo "JSONLD-TYPES: $(grep -oE '"@type":"[A-Za-z]+"' /tmp/page.html | sort -u | tr '\n' ' ')"
            echo "BODYCHARS: $(python3 /tmp/parse.py)"
          done
          echo "########## infrastructure ##########"
          echo "sitemap: $(curl -s -o /dev/null -w '%{http_code}' https://www.blacksync.ai/sitemap.xml) with $(curl -s https://www.blacksync.ai/sitemap.xml | grep -cE '<loc>') urls"
          echo "robots.txt: $(curl -s -o /dev/null -w '%{http_code}' https://www.blacksync.ai/robots.txt)"
          curl -s https://www.blacksync.ai/robots.txt | grep -iE "disallow" || echo "no disallow rules for crawlers"
          echo "www vs apex: $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://blacksync.ai/fsbo-ai)"
          echo "trailing slash: $(curl -s -o /dev/null -w '%{http_code} -> %{url_effective}' -L https://www.blacksync.ai/fsbo-ai/)"
