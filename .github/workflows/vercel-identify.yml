name: Identify Vercel projects

on:
  push:
    branches: ["claude/nice-keller-ur7mnt"]
    paths: [".github/workflows/vercel-identify.yml"]

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - name: List teams and projects with repo token
        run: |
          npm i -g vercel@latest
          echo "=== whoami ==="
          vercel whoami --token="${{ secrets.VERCEL_TOKEN }}" 2>&1
          echo "=== teams ==="
          vercel teams ls --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | head -40
          echo "=== projects (default scope) ==="
          vercel project ls --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | head -40
          echo "=== projects (blacksync scope) ==="
          vercel project ls --scope blacksync --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | head -40
          echo "=== inspect blacksync-website ==="
          vercel inspect blacksync-website --scope blacksync --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | head -40
