name: Redirect chain audit

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/redirect-audit.yml"]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Edge-case redirect chains
        run: |
          echo "=== http:// and mixed chains ==="
          for u in "http://blacksync.ai/ai-sdr" "http://www.blacksync.ai/ai-sdr" "http://blacksync.ai/industry/real-estate"; do
            echo "--- $u"
            curl -s -o /dev/null -L --max-redirs 10 -w "  chain: %{num_redirects} hops, final %{http_code} at %{url_effective}\n" "$u"
          done
          echo
          echo "=== trailing slash on old industry URLs (redirect chains?) ==="
          for u in /industry/real-estate/ /industry/mortgage/ /industry/insurance/; do
            echo "--- $u"
            curl -s -o /dev/null -L --max-redirs 10 -w "  chain: %{num_redirects} hops, final %{http_code} at %{url_effective}\n" "https://www.blacksync.ai$u"
          done
          echo
          echo "=== uppercase / mixed-case URLs ==="
          for u in /AI-SDR /Fsbo-Ai; do
            curl -s -o /dev/null -w "  %{http_code} $u\n" "https://www.blacksync.ai$u"
          done
          echo
          echo "=== markdown negotiation rewrite (Accept: text/markdown) ==="
          for u in /ai-sdr /fsbo-ai /expired-listing-ai; do
            echo "--- $u with Accept: text/markdown"
            curl -s -o /dev/null -w "  %{http_code} at %{url_effective}\n" -H "Accept: text/markdown" "https://www.blacksync.ai$u"
          done
          echo
          echo "=== Accept: */* (some bots) ==="
          curl -s -o /dev/null -w "  %{http_code} /ai-sdr Accept:*/*\n" -H "Accept: */*" "https://www.blacksync.ai/ai-sdr"
          echo
          echo "=== www.blacksync.ai vs blacksync.ai sitemap/robots consistency ==="
          curl -s -o /dev/null -w "  apex robots: %{http_code} -> %{redirect_url}\n" "https://blacksync.ai/robots.txt"
          curl -s -o /dev/null -w "  apex sitemap: %{http_code} -> %{redirect_url}\n" "https://blacksync.ai/sitemap.xml"
